services:
  postgres:
    image: postgres:17-alpine
    container_name: padel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: padel_dev
      POSTGRES_DB: padel_dev
    ports:
      # Host port 5433 avoids clashing with a system Postgres already on 5432
      - "5433:5432"
    volumes:
      - padel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padel -d padel_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  padel-pgdata:
